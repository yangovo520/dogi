button{font-family:inherit;cursor:pointer}

.quote{border-style:dashed;text-align:center;font-weight:700;font-size:17px}
.acts{display:grid;gap:12px;margin:22px 0 30px}
.extra{text-align:center;margin-top:10px}

.sig{font-size:12px;color:#666;margin-top:8px;letter-spacing:1px}

.live .hd{animation:hb 3.6s ease-in-out infinite;transform-origin:100px 140px}

function renderQ(){
 const q=Q[i];
 $("qn").textContent=`第 ${i+1} / ${Q.length} 题`;
 $("bar").style.width=((i+1)/Q.length*100)+"%";
 $("qbox").innerHTML=`<div class="q">${q[1]}</div>`+ord[i].map(k=>`<button class="opt${ans[i]===k?" sel":""}" data-k="${k}">${q[2][k]}</button>`).join("");
 const b=$("qbox");b.classList.remove("in");void b.offsetWidth;b.classList.add("in");
 $("prevBtn").style.visibility=i?"visible":"hidden";
}
function pick(btn){
 if(busy)return;busy=true;
 ans[i]=+btn.dataset.k;btn.classList.add("sel");
 setTimeout(()=>{busy=false;if(i<Q.length-1){i++;renderQ()}else finish()},260);
}
function finish(){
 for(let n=0;n<Q.length;n++)if(ans[n]===undefined){i=n;renderQ();toast("还有题目没答哦");return}
 const s=[0,0,0,0];ans.forEach((k,n)=>s[Q[n][0]]+=SC[k]);
 code=s.map((v,a)=>AX[a][v>=0?0:1]).join("");
 if(!counted){counted=true;setCount(getCount()+1);sb("dogi_inc").then(v=>{shown=v-1}).catch(()=>{})}
 renderResult();go("result");
}
function renderResult(){
 const t=T[code],no=String(Object.keys(T).indexOf(code)+1).padStart(2,"0");
 const c=[...code];
 const card=(h,p,cl)=>`<div class="card ${cl||""}">${h?`<h3>${h}</h3>`:""}<p>${p}</p></div>`;
 $("rs").innerHTML=`<p class="no">No.${no} · ${code}</p><h2>${t[0]}</h2><div class="dg">${dog(code)}</div><p class="sum">${t[1]}</p>`
 +card("性格详细分析",t[2])+card("恋爱模式",LOV[c[2]]+LOV2[c[1]])+card("社交模式",SOC[c[0]])+card("情绪处理方式",EMO[c[1]])
 +card("优点",t[3])+card("隐藏缺点",t[4])+card("适合的相处方式",TIP[c[3]]+TIP2[c[2]])+card("",`“${t[5]}”`,"quote")
 +`<div class="acts"><button class="btn" id="copyBtn">复制人格结果</button><button class="btn ghost" id="saveBtn">保存结果图片</button><button class="btn ghost" id="againBtn">重新测试</button></div>`
 +`<div class="extra">${EXTRA}<p class="sig">咩 ovo</p></div>`;
}
function shareText(){const t=T[code];return `【DOGI 人格测试】\n我是：${t[0]}（${code}）\n${t[1]}\n性格：${t[2]}\n优点：${t[3]}\n隐藏缺点：${t[4]}\n“${t[5]}”\n—— 咩 ovo`}
function copyRes(){
 const txt=shareText();
 const fb=()=>{const a=document.createElement("textarea");a.value=txt;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"已复制人格结果":"复制失败，请手动长按选择文字")};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast("已复制人格结果"),fb);else fb();
}
function wrap(ctx,txt,x,y,w,lh){let l="";for(const ch of txt){if(ctx.measureText(l+ch).width>w){ctx.fillText(l,x,y);y+=lh;l=ch}else l+=ch}ctx.fillText(l,x,y);return y+lh}
function saveImg(){
 try{
  const t=T[code],W=750,H=1100,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#000";ctx.lineWidth=6;ctx.strokeRect(24,24,W-48,H-48);
  ctx.fillStyle="#000";ctx.textAlign="center";const F='"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font="900 80px "+F;ctx.fillText("DOGI",W/2,130);
  ctx.font="22px "+F;ctx.fillStyle="#777";ctx.fillText("A LITTLE TEST ABOUT YOU",W/2,175);
  const im=new Image();
  im.onload=()=>{
   ctx.drawImage(im,W/2-190,210,380,380);
   ctx.fillStyle="#777";ctx.font="24px "+F;ctx.fillText("No."+String(Object.keys(T).indexOf(code)+1).padStart(2,"0")+" · "+code,W/2,650);
   ctx.fillStyle="#000";ctx.font="900 64px "+F;ctx.fillText(t[0],W/2,725);
   ctx.font="700 30px "+F;let y=wrap(ctx,t[1],W/2,795,560,46);
   ctx.font="26px "+F;ctx.fillStyle="#444";wrap(ctx,"“"+t[5]+"”",W/2,y+20,560,40);
   ctx.fillStyle="#000";ctx.font="26px "+F;ctx.fillText("咩 ovo",W/2,H-80);
   try{const url=cv.toDataURL("image/png");$("modImg").src=url;$("mod").classList.add("on");
    const a=document.createElement("a");a.href=url;a.download="DOGI-"+t[0]+".png";document.body.appendChild(a);a.click();a.remove()}
   catch(e){toast("当前浏览器不支持保存图片，请截屏保存")}
  };
  im.onerror=()=>toast("图片生成失败，请截屏保存");
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(dog(code));
 }catch(e){toast("当前浏览器不支持保存图片，请截屏保存")}
}

$("heroDog").innerHTML=dog("EXCG");
$("startBtn").onclick=start;
$("restartBtn").onclick=()=>{if(confirm("确定重新开始吗？当前答案将清空。"))start()};
$("prevBtn").onclick=()=>{if(!busy&&i>0){i--;renderQ()}};
$("qbox").onclick=e=>{const b=e.target.closest(".opt");if(b)pick(b)};
$("rs").onclick=e=>{const id=e.target.id;if(id=="copyBtn")copyRes();else if(id=="saveBtn")saveImg();else if(id=="againBtn")go("cover")};
$("modClose").onclick=()=>$("mod").classList.remove("on");
showCount();
</script>
</body>
</html>
